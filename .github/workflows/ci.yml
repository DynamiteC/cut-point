name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # ffmpeg unlocks the extractor suite, which otherwise skips: those tests
      # exercise the stream-copy path, the re-encode fallback and the path
      # traversal guard, and are worth running.
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: uv sync --frozen

      # data/ is gitignored, so the sample video is fetched rather than checked
      # in. Best effort: if the upstream host is unreachable the extractor tests
      # skip with a clear reason, exactly as they do today, rather than reddening
      # the build over someone else's outage.
      - name: Fetch the sample video
        run: bash scripts/fetch_sample_video.sh demo_001 || echo "fetch failed; extractor tests will skip"
        continue-on-error: true

      - name: Lint
        run: uv run ruff check .

      # No cloud credentials in CI. CUTPOINT_STORE defaults to "local" and
      # CUTPOINT_REQUIRE_AUTH is set per-test, so the suite runs fully offline:
      # Vertex AI is mocked at the injectable-client boundary, and the tests that
      # genuinely need a ClickHouse server skip with an explicit reason.
      # -rs prints those reasons, so a skip is visible rather than silent.
      # ClickHouse as a service container. Without it tests/test_detector.py
      # skipped, so a green badge certified everything EXCEPT the detector
      # accuracy the submission rests on: a change to changepoints.sql that broke
      # detection would have gone green.
      - name: Start ClickHouse
        run: |
          # Pin the default user to password-less access explicitly, so auth is
          # deterministic regardless of the image's baked-in default, and set
          # the credentials the seed and test steps use.
          docker run -d --name ch -p 8123:8123 --ulimit nofile=262144:262144 \
            -e CLICKHOUSE_USER=default \
            -e CLICKHOUSE_PASSWORD= \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            clickhouse/clickhouse-server:24.8-alpine
          # Wait for an AUTHENTICATED query to succeed, not just for the HTTP
          # port to answer. The port accepts anonymous SELECT 1 before the users
          # config is fully loaded, and querying then raised code 516
          # (authentication failed) at first use inside a test.
          ready=""
          for i in $(seq 1 45); do
            if curl -sf 'http://localhost:8123/?user=default&password=&query=SELECT%201' >/dev/null; then
              echo "clickhouse authenticated and ready"; ready="yes"; break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "clickhouse did not become ready; dumping container logs" >&2
            docker logs ch >&2 || true
            exit 1
          fi

      - name: Seed the database
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: "8123"
          CLICKHOUSE_USER: default
          CLICKHOUSE_DATABASE: cutpoint
          CLICKHOUSE_SECURE: "false"
          CLICKHOUSE_VERIFY: "false"
        run: |
          uv run python -m ingest.apply_schema
          uv run python -m ingest.generate --seed 42
          uv run python -m ingest.load

      - name: Test
        env:
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: "8123"
          CLICKHOUSE_USER: default
          CLICKHOUSE_DATABASE: cutpoint
          CLICKHOUSE_SECURE: "false"
          CLICKHOUSE_VERIFY: "false"
        run: uv run pytest -v -rs --ignore=tests/load --ignore=tests/soak --ignore=tests/stress

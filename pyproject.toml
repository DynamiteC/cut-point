[project]
name = "cutpoint"
version = "0.1.0"
description = "CutPoint - fuses ClickHouse trailer retention analytics with Gemini video understanding to produce Director's Notes"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.0.0",
    "google-cloud-aiplatform[adk,agent_engines]>=1.101.0",
    "google-genai>=1.0.0",
    "clickhouse-connect>=0.8.0",
    "mcp-clickhouse>=0.1.8",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
    "numpy>=2.1.0",
    "google-cloud-firestore>=2.29.0",
    "google-cloud-pubsub>=2.39.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "matplotlib>=3.9.0",
    "psutil>=6.0.0",
    "pytest-timeout>=2.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "ingest", "report", "services"]
